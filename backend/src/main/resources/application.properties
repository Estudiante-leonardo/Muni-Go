spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/muni_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:3320}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=${PORT:8081}

# HikariCP connection pool tuning
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Security: prevent leaking internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# CORS - restrict to frontend domain(s) in production
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Explicit cache type
spring.cache.type=simple

# App-level logging
logging.level.com.tramites=INFO

# Gemini AI
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

# JWT Authentication
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:600000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

# Spring AI - Google GenAI Chat
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite
spring.ai.google.genai.chat.temperature=0.7
spring.ai.google.genai.chat.max-output-tokens=500

# Spring AI - Google GenAI Embeddings
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.dimensions=768

# Spring AI - PgVector Store
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true

# Activar perfil local en desarrollo (Spring Boot lo lee autom�ticamente)
spring.profiles.active=local